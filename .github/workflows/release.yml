# 桌面端发布流水线：打 tag 即构建 Windows 安装包、签名、生成 latest.json 并生成候选 Release；验收后再提升为正式版。
#
# 客户端自动更新链路：
#   tauri.conf.json 的 plugins.updater.endpoints 指向
#   https://github.com/CHEN126110/douyin-auto-uploader-/releases/latest/download/latest.json
#   → 本工作流先生成预发布候选（不改变 latest）；通过旧版升级验收后才提升为正式版。
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   TAURI_SIGNING_PRIVATE_KEY           更新签名私钥「文件内容」（不是路径）
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  生成密钥时用的密码
name: 发布桌面端

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的版本 tag（例如 v4.0.29，需已存在）"
        required: true
      notes:
        description: "更新说明（会显示在客户端的更新弹窗里）"
        required: false
        default: ""

permissions:
  contents: write

env:
  # GitHub Release 会把 asset 名里的非 ASCII 字符替换成 '.'，中文产品名会让
  # latest.json 里的下载 URL 对不上，所以统一重命名成这个 ASCII 前缀。
  ASSET_PREFIX: DouyinSockPublisher
  # windows-latest 是 en-US 镜像（ACP=1252），Actions 把 step 的 stdout 接成管道，
  # Python 会按 locale 编码写 stdout，脚本里的中文日志会直接 UnicodeEncodeError 打断 CI。
  # 同时保证以默认编码 open() 读 UTF-8 的 user_settings.json / cfg.yaml 不会静默变乱码。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 解析并校验版本号
        id: version
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $tag = if ($env:INPUT_TAG) { $env:INPUT_TAG } else { $env:REF_NAME }
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "tag 格式不合法: '$tag'（需形如 v4.0.29）"
          }
          $version = $tag.Substring(1)

          # 版本号分散在 4 处，任何一处对不上都会让「界面显示的版本」和「updater 比对的版本」打架
          $pkg  = (Get-Content "tauri-app/package.json" -Raw | ConvertFrom-Json).version
          $conf = (Get-Content "tauri-app/src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version

          $cargoLine = (Get-Content "tauri-app/src-tauri/Cargo.toml") |
                       Where-Object { $_ -match '^version\s*=\s*"' } |
                       Select-Object -First 1
          $cargoVersion = [regex]::Match($cargoLine, '"([^"]+)"').Groups[1].Value

          $cfgLine = (Get-Content "cfg.yaml") |
                     Where-Object { $_ -match '^\s*version:\s*' } |
                     Select-Object -First 1
          $cfgVersion = [regex]::Match($cfgLine, 'version:\s*(.+)$').Groups[1].Value.Trim()

          $mismatch = @()
          if ($pkg -ne $version)          { $mismatch += "tauri-app/package.json = $pkg" }
          if ($conf -ne $version)         { $mismatch += "tauri.conf.json = $conf" }
          if ($cargoVersion -ne $version) { $mismatch += "Cargo.toml = $cargoVersion" }
          if ($cfgVersion -ne $version)   { $mismatch += "cfg.yaml = $cfgVersion" }
          if ($mismatch.Count -gt 0) {
            $detail = $mismatch -join "; "
            throw "版本号与 tag '$tag' 不一致：$detail。请先运行 tauri-app/scripts/bump-version.ps1 $version 再打 tag"
          }

          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "版本校验通过: $tag"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            tauri-app/package-lock.json
            mcp-server/package-lock.json

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-app/src-tauri -> target

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r tauri-app/python-sidecar/requirements.txt

          # 依赖清单与实际 import 脱节时在这里几秒内红掉，而不是等 PyInstaller 打完十几分钟、
          # 打出一个能装不能跑的包（PyInstaller 对缺失模块只写 WARNING，退出码仍是 0）。
          # 这几个模块正是 app.py 启动时顶层 import 的。放在 ci_prepare 之前跑：
          # 此时 user_settings.json 尚未生成，SettingsManager 走默认分支，不会有额外副作用。
          python -c "import src.orm, src.utils, src.config, src.llm_client, src.ops_engine, src.professional_title_generator, src.enhanced_category_selector"
          if ($LASTEXITCODE -ne 0) { throw "后端启动链 import 自检失败：requirements.txt 与实际依赖脱节" }

      - name: 安装 MCP Server 依赖
        # mcp-server/node_modules 被 .gitignore 第 1 行排除，CI 检出后是空的；
        # 而 tauri.conf.json 的 bundle.resources 会把整个 mcp-server 目录递归打进安装包。
        # 不装依赖的话，装机后内置 MCP Server 一启动就 ERR_MODULE_NOT_FOUND。
        working-directory: mcp-server
        run: npm ci --omit=dev

      - name: 校验 MCP 依赖可解析
        working-directory: mcp-server
        shell: pwsh
        run: |
          node --input-type=module -e "await import('@modelcontextprotocol/sdk/server/stdio.js'); await import('zod'); console.log('mcp deps resolvable')"
          if ($LASTEXITCODE -ne 0) { throw "mcp-server 依赖不可解析，装机后内置 MCP Server 会 ERR_MODULE_NOT_FOUND" }

      - name: 准备构建前置资产
        shell: pwsh
        run: python tauri-app/scripts/ci_prepare_build_assets.py

      - name: 构建 Python sidecar
        shell: pwsh
        run: |
          python tauri-app/python-sidecar/build_sidecar.py
          $exe = "tauri-app/src-tauri/sidecar/python-backend.exe"
          if (-not (Test-Path $exe)) { throw "sidecar 构建产物缺失: $exe" }
          Write-Host ("sidecar 大小: {0:N1} MB" -f ((Get-Item $exe).Length / 1MB))

      - name: sidecar 冒烟测试（后端必须真的能起来）
        # 只验证 exe 存在是不够的：缺依赖时 PyInstaller 照样打包成功、CI 全绿，
        # 用户装上却是 ModuleNotFoundError、5001 永不监听、应用打不开。
        # 放在 Rust 构建之前：坏包连签名环节都进不去，还省一次 LTO 编译。
        shell: pwsh
        run: |
          $exe = (Resolve-Path "tauri-app/src-tauri/sidecar/python-backend.exe").Path
          $env:SIDECAR_MODE = "1"   # 跳过 PySide6 GUI 分支，纯后端模式
          $p = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput "sidecar-smoke.out.log" -RedirectStandardError "sidecar-smoke.err.log"
          try {
            $deadline = (Get-Date).AddSeconds(120)
            $ok = $false
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 800
              if ($p.HasExited) { break }   # 启动即崩是秒退，不空转满 120 秒
              try {
                $resp = Invoke-WebRequest -Uri "http://127.0.0.1:5001/health" -TimeoutSec 5 -UseBasicParsing
                if ($resp.StatusCode -eq 200) { $ok = $true; break }
              } catch { }
            }
            if (-not $ok) {
              # frozen 模式下 src/constants.py 会把 stdout/stderr 重定向到临时目录，
              # 所以 import 期之后的报错只能在 bootstrap.log 里看到，优先 dump 它
              Write-Host "=== python-backend.bootstrap.log ==="
              Get-Content "$env:LOCALAPPDATA\com.dyin.sock-publisher\logs\python-backend.bootstrap.log" -Tail 80 -ErrorAction SilentlyContinue
              Write-Host "=== stderr ==="
              Get-Content "sidecar-smoke.err.log" -ErrorAction SilentlyContinue
              Write-Host "=== stdout ==="
              Get-Content "sidecar-smoke.out.log" -ErrorAction SilentlyContinue
              throw "sidecar 冒烟失败：/health 未就绪（通常是启动链 ModuleNotFoundError）"
            }
            Write-Host "sidecar /health 就绪，后端可正常启动"
          } finally {
            if (-not $p.HasExited) {
              try { Invoke-RestMethod -Uri "http://127.0.0.1:5001/internal/terminate" -Method Post -TimeoutSec 5 | Out-Null } catch { }
              Start-Sleep -Seconds 2
              if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
            }
          }

      - name: 安装前端依赖
        working-directory: tauri-app
        run: npm ci

      - name: 运行发布回归
        shell: pwsh
        run: |
          python -m pip install pytest
          python -m pytest tests taobao-publisher/tests -q --basetemp taobao-publisher/tmp/release-pytest
          if ($LASTEXITCODE -ne 0) { throw "发布回归失败" }
          node --test tests/media_processing_flow.cjs tests/whitebg_selection_flow.cjs tests/product_delete_flow.cjs tests/updater_flow.cjs
          if ($LASTEXITCODE -ne 0) { throw "前端交互回归失败" }

      - name: 构建 Tauri 安装包（含更新签名）
        working-directory: tauri-app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: 整理产物并生成 latest.json
        id: artifacts
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INPUT_NOTES: ${{ github.event.inputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          $version = $env:VERSION
          $bundleDir = "tauri-app/src-tauri/target/release/bundle/nsis"

          $installer = Get-ChildItem $bundleDir -Filter "*-setup.exe" -ErrorAction Stop |
                       Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $sig = "$($installer.FullName).sig"
          if (-not (Test-Path $sig)) {
            throw "未找到更新签名文件: $sig（确认已配置 TAURI_SIGNING_PRIVATE_KEY，且 bundle.createUpdaterArtifacts=true）"
          }

          # 重命名成 ASCII：GitHub 会把 asset 名里的中文替换成 '.'，
          # 直接用中文名会导致 latest.json 的 url 与实际 asset 名不匹配 → 更新下载 404
          $stageDir = "release-assets"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          $assetName = "{0}_{1}_x64-setup.exe" -f $env:ASSET_PREFIX, $version
          Copy-Item $installer.FullName (Join-Path $stageDir $assetName) -Force
          Copy-Item $sig (Join-Path $stageDir ($assetName + ".sig")) -Force

          $notes = $env:INPUT_NOTES
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "版本 $version" }

          $downloadUrl = "https://github.com/{0}/releases/download/v{1}/{2}" -f $env:REPO, $version, $assetName
          $manifest = [ordered]@{
            version   = $version
            notes     = $notes
            pub_date  = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = (Get-Content $sig -Raw).Trim()
                url       = $downloadUrl
              }
            }
          }
          # UTF-8 无 BOM：updater 解析 latest.json 不接受 BOM，notes 含中文需正确编码
          [System.IO.File]::WriteAllText(
            (Join-Path $stageDir "latest.json"),
            ($manifest | ConvertTo-Json -Depth 6),
            (New-Object System.Text.UTF8Encoding($false))
          )

          Get-ChildItem $stageDir | ForEach-Object {
            Write-Host ("  {0}  ({1:N1} MB)" -f $_.Name, ($_.Length / 1MB))
          }
          # 注意：notes 不写进 GITHUB_OUTPUT。手填的更新说明可能含换行，
          # 而 key=value 的单行格式遇到换行会让 runner 直接报 Invalid format 失败。
          # 需要它的 step 用同一个表达式自己算即可。
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 发布候选版本（不推送正式更新）
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ github.event.inputs.notes || format('版本 {0}，待升级验收', steps.version.outputs.version) }}
        run: |
          $tag = $env:TAG
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "候选版本 $tag 已存在，禁止自动覆盖已签名的安装包；请使用新版本号"
          }
          [IO.File]::WriteAllText("release-notes.txt", $env:NOTES, [Text.UTF8Encoding]::new($false))
          gh release create $tag (Get-ChildItem release-assets | ForEach-Object { $_.FullName }) --verify-tag --title $tag --notes-file release-notes.txt --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw "发布候选版本失败" }

      - name: 校验候选更新资源
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          $url = "https://github.com/{0}/releases/download/{1}/latest.json" -f $env:REPO, $env:TAG
          $manifest = Invoke-RestMethod -Uri $url -MaximumRedirection 5
          if ($manifest.version -ne $env:VERSION) { throw "候选清单版本不一致" }
          if (-not $manifest.platforms.'windows-x86_64'.signature) { throw "候选安装包缺少签名" }
          $head = Invoke-WebRequest -Uri $manifest.platforms.'windows-x86_64'.url -Method Head -MaximumRedirection 5
          Write-Host "候选版本资源就绪: HTTP $($head.StatusCode)。正式 latest 未改变，等待升级验收。"
