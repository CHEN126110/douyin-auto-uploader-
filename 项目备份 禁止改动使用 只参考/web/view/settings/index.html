<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统设置</title>
    <!-- 引入主页面的现代化按钮样式 -->
    <link rel="stylesheet" href="../../admin/css/modern-glass.css">
    <link rel="stylesheet" href="../../admin/css/performance-optimization.css">
    <style>
        /* 🔧 修复：移除modal容器，直接为layui弹窗提供内容样式 */
        .settings-content {
            padding: 30px;
            background: linear-gradient(135deg, #f8f9ff 0%, #fdf2f8 50%, #fffbf0 100%);
            min-height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .setting-group {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: none;
            transition: box-shadow 0.2s ease;
        }

        .setting-group:hover {
            box-shadow: none;
        }
        
        .setting-group:last-child {
            margin-bottom: 0;
        }

        .setting-group-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(92, 124, 250, 0.1);
        }

        .setting-group-header .icon {
            font-size: 20px;
            margin-right: 10px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(92, 124, 250, 0.1);
            border-radius: 8px;
            flex-shrink: 0;
        }
        
        .setting-group-title {
            color: #2c3e50;
            font-size: 18px;
            font-weight: 600;
            margin: 0;
        }

        .refactoring-notice {
            background: linear-gradient(135deg, #fff3cd 0%, #fff5d7 100%);
            border: 2px solid #ffeaa7;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(255, 193, 7, 0.2);
        }
        
        .refactoring-notice h3 {
            color: #8b5a00;
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .refactoring-notice p {
            color: #6c5700;
            font-size: 14px;
            line-height: 1.4;
            margin-bottom: 15px;
        }
        
        .refactoring-phases {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .phase-item {
            background: rgba(255, 255, 255, 0.8);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 193, 7, 0.3);
            text-align: center;
        }
        
        .phase-item strong {
            color: #8b5a00;
            font-size: 11px;
            display: block;
            margin-bottom: 3px;
        }
        
        .phase-item span {
            color: #6c5700;
            font-size: 10px;
        }

        /* 成本项目配置样式 */
        .cost-items-container {
            background: rgba(248, 250, 252, 0.8);
            border-radius: 12px;
            padding: 20px;
        }

        .cost-items-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(59, 130, 246, 0.1);
        }

        .cost-items-header h4 {
            color: #374151;
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        /* 已移除旧的按钮样式，现在使用主页面的modern-btn样式 */
        /* .btn-add-cost-item 样式已被 modern-btn optimized-interactive 替代 */

        .cost-items-list {
            min-height: 200px;
            margin-bottom: 20px;
        }

        .cost-item {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .cost-item:hover {
            border-color: #3b82f6;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.1);
        }

        .cost-item-info {
            flex: 1;
        }

        .cost-item-name {
            font-weight: 600;
            color: #374151;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .cost-item-details {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #6b7280;
        }

        .cost-item-type {
            background: #f3f4f6;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .cost-item-value {
            font-weight: 600;
            color: #059669;
        }

        .cost-item-actions {
            display: flex;
            gap: 12px;
            margin-left: 16px;
        }

        /* 已移除旧的按钮样式，现在使用主页面的modern-btn样式 */
        /* .btn-edit 样式已被 modern-btn modern-btn-warning optimized-interactive 替代 */
        /* .btn-delete 样式已被 modern-btn modern-btn-danger optimized-interactive 替代 */
        
        /* 设置页面按钮的自定义布局样式 */
        .cost-items-header .modern-btn {
            margin-left: 12px;
            min-width: 120px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        
        .cost-item-actions .modern-btn {
            padding: 8px 16px;
            font-size: 12px;
            min-width: 60px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .cost-summary {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            justify-content: space-around;
            border: 1px solid #e5e7eb;
        }

        .summary-item {
            text-align: center;
        }

        .summary-item .label {
            display: block;
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .summary-item .value {
            font-size: 16px;
            font-weight: 600;
            color: #374151;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #6b7280;
        }

        .empty-state .icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .empty-state h4 {
            margin: 0 0 8px 0;
            color: #374151;
        }

        .empty-state p {
            margin: 0;
            font-size: 14px;
        }

        /* 🔧 修复：恢复layer控制按钮为相对容器的绝对定位，并为标题栏预留空间 */
        .layui-layer-setwin {
            position: absolute !important;
            top: 12px !important;
            right: 12px !important;
        }
        .layui-layer .layui-layer-setwin {
            position: absolute !important;
            top: 12px !important;
            right: 12px !important;
        }
        .layui-layer-title {
            position: relative !important;
            height: 42px !important;
            line-height: 42px !important;
            padding-right: 60px !important; /* 为关闭/最大化/最小化预留空间 */
        }
        
        /* 响应式设计 */
        @media (max-width: 768px) {
            .settings-content {
                padding: 20px;
            }
            
            .setting-group {
                padding: 20px;
            }
            
            .refactoring-phases {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
        <div class="settings-content">
        <!-- 价格策略配置 -->
        <div class="setting-group">
            <div class="setting-group-header">
                <div class="icon">💰</div>
                <h2 class="setting-group-title">价格策略配置</h2>
            </div>
            
            <div class="cost-items-container">
                <div class="cost-items-header">
                    <h4>成本项目配置</h4>
                    <button class="modern-btn optimized-interactive" onclick="addCostItem()">
                        <span class="icon">➕</span>
                        添加成本项目
                    </button>
                </div>
                

                
                <div id="cost-items-list" class="cost-items-list">
                    <!-- 成本项目将通过JavaScript动态加载 -->
                </div>
                
                <div class="cost-summary">
                    <div class="summary-item">
                        <span class="label">总成本项目数：</span>
                        <span id="total-cost-items" class="value">0</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">固定成本总计：</span>
                        <span id="total-fixed-cost" class="value">¥0.00</span>
                    </div>
                    <div class="summary-item">
                        <span class="label">目标毛利率：</span>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <input type="number" id="target-profit-margin" placeholder="30" min="0" max="100" step="0.1" 
                                   style="width: 80px; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; text-align: center;">
                            <span style="color: #374151; font-weight: 500;">%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 链接采集配置 -->
        <div class="setting-group">
            <div class="setting-group-header">
                <div class="icon">🔗</div>
                <h2 class="setting-group-title">链接采集配置</h2>
            </div>
            
            <div class="cost-items-container">
                <div class="cost-items-header">
                    <h4>采集选项</h4>
                </div>
                
                <div style="padding: 20px;">
                    <!-- 自动下载图片 -->
                    <div style="margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
                        <div>
                            <label style="font-weight: 600; color: #374151; display: block; margin-bottom: 4px;">自动下载图片</label>
                            <span style="font-size: 12px; color: #6b7280;">采集时自动下载商品主图和详情图片</span>
                        </div>
                        <input type="checkbox" id="capture-download-images" checked lay-skin="switch" lay-text="开启|关闭">
                    </div>
                    
                    <!-- 提取SKU信息 -->
                    <div style="margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
                        <div>
                            <label style="font-weight: 600; color: #374151; display: block; margin-bottom: 4px;">提取SKU信息</label>
                            <span style="font-size: 12px; color: #6b7280;">采集商品规格信息（颜色、尺寸等）</span>
                        </div>
                        <input type="checkbox" id="capture-extract-sku" checked lay-skin="switch" lay-text="开启|关闭">
                    </div>
                    
                    <!-- 提取商品参数 -->
                    <div style="margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between;">
                        <div>
                            <label style="font-weight: 600; color: #374151; display: block; margin-bottom: 4px;">提取商品参数</label>
                            <span style="font-size: 12px; color: #6b7280;">采集商品详细参数信息</span>
                        </div>
                        <input type="checkbox" id="capture-extract-params" checked lay-skin="switch" lay-text="开启|关闭">
                    </div>
                    
                    <!-- 默认库存 -->
                    <div style="margin-bottom: 20px;">
                        <label style="font-weight: 600; color: #374151; display: block; margin-bottom: 8px;">默认库存数量</label>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <input type="number" id="capture-default-stock" value="100" min="1" max="9999" 
                                   style="width: 100px; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px;">
                            <span style="color: #6b7280; font-size: 12px;">件</span>
                        </div>
                    </div>
                    
                    <!-- 登录等待时间 -->
                    <div style="margin-bottom: 20px;">
                        <label style="font-weight: 600; color: #374151; display: block; margin-bottom: 8px;">登录等待时间</label>
                        <div style="display: flex; align-items: center; gap: 8px;">
                            <input type="number" id="capture-login-timeout" value="120" min="30" max="300" 
                                   style="width: 100px; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px;">
                            <span style="color: #6b7280; font-size: 12px;">秒（需要登录时的最长等待时间）</span>
                        </div>
                    </div>
                    
                    <!-- 文件保存位置 -->
                    <div style="margin-bottom: 20px;">
                        <label style="font-weight: 600; color: #374151; display: block; margin-bottom: 8px;">
                            文件保存位置
                            <span style="font-size: 12px; font-weight: normal; color: #f59e0b; margin-left: 8px;">⚠️ 重要配置</span>
                        </label>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                            <div style="display: flex; align-items: center; gap: 8px;">
                                <input type="text" id="capture-save-path" value="uploads/products" 
                                       placeholder="uploads/products" 
                                       style="flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; font-family: 'Consolas', monospace;">
                                <button type="button" onclick="resetSavePath()" 
                                        style="padding: 8px 16px; background: #6b7280; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; transition: all 0.2s;"
                                        onmouseover="this.style.background='#4b5563'" 
                                        onmouseout="this.style.background='#6b7280'">
                                    重置
                                </button>
                            </div>
                            <div style="font-size: 12px; color: #6b7280; line-height: 1.5;">
                                <div style="margin-bottom: 4px;">💡 <strong>使用说明：</strong></div>
                                <div style="padding-left: 20px;">
                                    • 相对路径：从程序目录开始（推荐，便于打包）<br>
                                    • 绝对路径：如 D:/MyFiles/products（不推荐打包使用）<br>
                                    • 默认值：uploads/products（程序目录下的uploads文件夹）
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 保存按钮 -->
                    <div style="margin-top: 30px; text-align: right;">
                        <button class="modern-btn optimized-interactive" onclick="saveCaptureSettings()">
                            <span class="icon">💾</span>
                            保存采集配置
                        </button>
                    </div>
                </div>
            </div>
        </div>


        <!-- 界面设置部分已移除 -->
                    
    <script>
        // 🔧 修复：完整的成本项目管理功能
        // 移除重复定义，使用window.costItems统一管理
        
        // 全局函数定义（确保可以被onclick调用）
        function addCostItem() {
            // 使用layui的弹窗
            if (typeof parent.layer !== 'undefined') {
                parent.layer.prompt({
                    formType: 0,
                    title: '添加成本项目',
                    area: ['400px', '300px'],
                    content: `
                        <div style="padding: 20px;">
                            <div style="margin-bottom: 15px;">
                                <label>项目名称：</label>
                                <input type="text" id="cost-name" placeholder="如：包装费" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            </div>
                            <div style="margin-bottom: 15px;">
                                <label>成本类型：</label>
                                <select id="cost-type" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                                    <option value="fixed">固定成本</option>
                                    <option value="percentage">百分比成本(基于基础成本)</option>
                                    <option value="platform_fee">平台扣点(基于销售金额)</option>
                                    <option value="per_unit">单位成本</option>
                                </select>
                            </div>
                            <div style="margin-bottom: 15px;">
                                <label>成本值：</label>
                                <input type="number" id="cost-value" placeholder="如：2.5" step="0.01" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            </div>
                            <div style="margin-bottom: 15px;">
                                <label>描述：</label>
                                <input type="text" id="cost-description" placeholder="可选" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            </div>
                        </div>
                    `,
                    btn: ['确定', '取消'],
                    yes: function(index) {
                        const name = document.getElementById('cost-name').value.trim();
                        const type = document.getElementById('cost-type').value;
                        const value = parseFloat(document.getElementById('cost-value').value);
                        const description = document.getElementById('cost-description').value.trim();
                        
                        if (!name || isNaN(value)) {
                            parent.layer.msg('请填写完整信息', {icon: 2});
                            return;
                        }
                        
                        window.saveCostItem({name, cost_type: type, value, description}, index);
                    }
                });
            } else {
                // 降级处理
                const name = prompt('请输入成本项目名称:');
                if (name) {
                    const value = parseFloat(prompt('请输入成本值:'));
                    if (!isNaN(value)) {
                        window.saveCostItem({name, cost_type: 'fixed', value, description: ''});
                    }
                }
            }
        };
        
        function editCostItem(itemName) {
            const item = window.costItems.find(i => i.name === itemName);
            if (!item) {
                console.error('❌ 找不到成本项目:', itemName);
                return;
            }
            console.log('✅ 找到成本项目:', item);
            
            if (typeof parent.layer !== 'undefined') {
                parent.layer.prompt({
                    formType: 0,
                    title: '编辑成本项目',
                    area: ['400px', '300px'],
                    content: `
                        <div style="padding: 20px;">
                            <div style="margin-bottom: 15px;">
                                <label>项目名称：</label>
                                <input type="text" id="edit-cost-name" value="${item.name}" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            </div>
                            <div style="margin-bottom: 15px;">
                                <label>成本类型：</label>
                                <select id="edit-cost-type" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                                    <option value="fixed" ${item.cost_type === 'fixed' ? 'selected' : ''}>固定成本</option>
                                    <option value="percentage" ${item.cost_type === 'percentage' ? 'selected' : ''}>百分比成本(基于基础成本)</option>
                                    <option value="platform_fee" ${item.cost_type === 'platform_fee' ? 'selected' : ''}>平台扣点(基于销售金额)</option>
                                    <option value="per_unit" ${item.cost_type === 'per_unit' ? 'selected' : ''}>单位成本</option>
                                </select>
                            </div>
                            <div style="margin-bottom: 15px;">
                                <label>成本值：</label>
                                <input type="number" id="edit-cost-value" value="${item.value}" step="0.01" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            </div>
                            <div style="margin-bottom: 15px;">
                                <label>描述：</label>
                                <input type="text" id="edit-cost-description" value="${item.description || ''}" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            </div>
                        </div>
                    `,
                    btn: ['确定', '取消'],
                    yes: function(index) {
                        const name = document.getElementById('edit-cost-name').value.trim();
                        const type = document.getElementById('edit-cost-type').value;
                        const value = parseFloat(document.getElementById('edit-cost-value').value);
                        const description = document.getElementById('edit-cost-description').value.trim();
                        
                        if (!name || isNaN(value)) {
                            parent.layer.msg('请填写完整信息', {icon: 2});
                            return;
                        }
                        
                        window.updateCostItem(itemName, {name, cost_type: type, value, description}, index);
                    }
                });
            }
        };
        
        function deleteCostItem(itemName) {
            if (typeof parent.layer !== 'undefined') {
                parent.layer.confirm(`确定要删除成本项目"${itemName}"吗？`, {
                    btn: ['确定', '取消']
                }, function(index) {
                    window.removeCostItem(itemName, index);
                });
            } else {
                if (confirm(`确定要删除成本项目"${itemName}"吗？`)) {
                    window.removeCostItem(itemName);
                }
            }
        };
        
        (function() {
            'use strict';
            
            // 🔧 修复：声明全局变量
            window.costItems = [];
            
            // 🔧 修复：将loadCostItems函数定义移到调用之前
            // 加载成本项目
            window.loadCostItems = async function loadCostItems() {
                try {
                    console.log('🔄 开始加载成本项目...');
                    const response = await fetch('/api/pricing/cost-items');
                    const data = await response.json();
                    
                    console.log('📦 API响应数据:', data);
                    
                    if (data.success) {
                        // 修复：正确访问嵌套的数据结构
                        window.costItems = (data.data && data.data.cost_items) || [];
                        console.log('✅ 成功加载成本项目:', window.costItems.length, '个');
                        window.renderCostItems();
                        window.updateSummary();
                    } else {
                        console.error('❌ 加载成本项目失败:', data.error);
                        window.showEmptyState();
                    }
                } catch (error) {
                    console.error('❌ 加载成本项目出错:', error);
                    window.showEmptyState();
                }
            }
            
            // 渲染成本项目列表
            window.renderCostItems = function renderCostItems() {
                const container = document.getElementById('cost-items-list');
                if (!container) return;
                console.log('🎨 开始渲染成本项目，数量:', window.costItems.length);
                console.log('📋 成本项目详情:', window.costItems);
                
                if (!window.costItems || window.costItems.length === 0) {
                    console.log('📭 没有成本项目，显示空状态');
                    window.showEmptyState();
                    return;
                }
                
                const html = window.costItems.map(item => `
                    <div class="cost-item" data-name="${item.name}">
                        <div class="cost-item-info">
                            <div class="cost-item-name">${item.name}</div>
                            <div class="cost-item-details">
                                <span class="cost-item-type">${window.getCostTypeText(item.cost_type)}</span>
                                <span class="cost-item-value">${window.formatCostValue(item)}</span>
                                <span class="cost-item-description">${item.description || '无描述'}</span>
                            </div>
                        </div>
                        <div class="cost-item-actions">
                            <button class="modern-btn modern-btn-warning optimized-interactive" onclick="editCostItem('${item.name}')">编辑</button>
                            <button class="modern-btn modern-btn-danger optimized-interactive" onclick="deleteCostItem('${item.name}')">删除</button>
                        </div>
                    </div>
                `).join('');
                
                console.log('🖼️ 生成的HTML长度:', html.length);

            // 防抖函数
            function debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }

                    }
                    if (settings.extract_sku !== undefined) {
                        document.getElementById('capture-extract-sku').checked = settings.extract_sku;
