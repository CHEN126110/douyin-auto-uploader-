[package]
name = "douyin-sock-publisher"
version = "4.0.36"
description = "抖音袜子发布工具 - Tauri版本"
authors = ["Dyin"]
license = "MIT"
repository = ""
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["blocking", "json"] }
arboard = "3.4"

# 仅 ui_watchdog（窗口探测、UI 线程调用栈回溯）和 event_target_guard（窗口子类化）使用。
# 版本与 tao / wry 传递依赖的 windows 一致，不引入第二份。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
opt-level = 1
debug = 0
codegen-units = 16

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
# 保留函数名与行号表。它们只进 .pdb、不进 exe（2026-10-20 实测：exe 7.52 MB 不变，.pdb 由 3.3 MB 变 24 MB，构建多约 15 秒）。
# 原来的 strip = true 会让 .pdb 里没有任何 Rust 函数名，ui_watchdog 的停摆调用栈和 panic.log 的回溯就只剩地址。
# .pdb 必须与 exe 是同一次构建、放在 exe 旁边（target\release 里本来就是）。
debug = "line-tables-only"
strip = "none"
