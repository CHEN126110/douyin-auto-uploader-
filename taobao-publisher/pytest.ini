[pytest]
# 缓存目录放进 tmp/：既避免污染子项目根目录，也绕开本机沙箱对默认
# `.pytest_cache` 的写限制（写不进去时 pytest 会在 rootdir 建
# `pytest-cache-files-*` 临时目录，很难清理）。
cache_dir = tmp/.pytest_cache
testpaths = tests
# 只收集本子项目的测试；仓库根的 tests/ 有自己的运行方式。
norecursedirs = tmp .pytest_cache __pycache__
# `tmp_path` 的基准目录也放进 tmp/：默认的 `%TEMP%\pytest-of-<user>` 在本机
# 沙箱下会被拒绝列举（`PermissionError: [WinError 5]`），于是所有用到
# `tmp_path` 的测试都 ERROR。放进工作区既真实可写，也让临时文件可回收。
#
# **故意与仓库根 pytest.ini 用不同的目录**：浏览器类测试会在 basetemp 下留
# `isolated-browser-profile/` 并驻留一个 Chrome 进程，第二次运行时 pytest
# 清不掉那个目录（`WinError 32 文件被占用`）就会整场 ERROR。
# 两个测试套件各用各的 basetemp，互不牵连。
addopts = --basetemp=tmp/pytest-basetemp
markers =
    real_ledger_path: 豁免 conftest 的上传账本隔离，让测试看到真实的 ledger_path() 行为。
