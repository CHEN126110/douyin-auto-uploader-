#
# 数据来源（本次落盘）：
#   - Cursor MCP「cursor-ide-browser」→ browser_snapshot（viewId: e3a8cd）
#   - 页面 URL: https://fxg.jinritemai.com/ffa/g/create?
#   - 抓取时刻（文档记录）: 2026-04-06
#
# 原始快照全文见同目录：mcp-a11y-snapshot-raw.txt
# （该文件保留 MCP 输出原样，可能含重复 key，勿用严格 YAML 解析器打开。）
# =============================================================================

meta:
  product_path: "/ffa/g/create"
  full_url_example: "https://fxg.jinritemai.com/ffa/g/create?"
  mcp_tool: "cursor-ide-browser / browser_snapshot"
  snapshot_max_depth_used: 50
  total_refs_reported: 153
  interactive_refs_reported: 127

# -----------------------------------------------------------------------------
# 关于「隐藏元素」与完整 DOM
# -----------------------------------------------------------------------------
# MCP 的 browser_snapshot 基于 Chromium 无障碍树（AX Tree），通常：
#   - 不包含：display:none、visibility:hidden（且未暴露给 a11y）、多数纯装饰节点
#   - 不完整包含：Shadow DOM 内未转发 a11y 的节点、Canvas、部分自定义组件
#   - Popover / 悬停才出现的「本地上传」等，仅在悬停后快照会更完整
# 若需要「含隐藏节点的完整 HTML」请在 DrissionPage 内对 document.documentElement
# 或指定容器执行 outerHTML 导出（体积极大，建议按 attr-field-id 分区截取）。
# -----------------------------------------------------------------------------

limitations:
  - "无障碍树为扁平/弱层级列表，nth 仅表示同 role+同名下的序号，非 DOM 兄弟索引。"
  - "树末常出现与上方重复的 name/ref（平台对 label/控件双重暴露），自动化以 DOM/XPath 为准。"
  - "本清单中商品标题等当前值已脱敏，避免误提交隐私；对照逻辑请以 placeholder/role 为准。"

# -----------------------------------------------------------------------------
# 本项目自动化中常用的 DOM 锚点（来自 src/utils.py / app.py，运行时才有）
# -----------------------------------------------------------------------------
# 下列选择器不一定出现在 MCP 无障碍快照里，但 DrissionPage 自动化依赖它们。
automation_dom_hints:

  attr_field_id:
    description: "抖音表单区块常用 data 属性，用于 upload_file、类目、材质等"
    examples:
      - "主图3:4"
      - "主图视频"
      - "白底图"
      - "商品详情"
      - "面料材质"
      - "水洗标/吊牌图"
      - "商品类目"

  element_id:
    description: "颜色分类 SKU 区域"
    examples:
      - "skuValue-颜色分类"
      - "skuValue-码数"

  sku_upload_popover:
    description: "SKU 悬停后 Popover 内「本地上传」label，class 可能随构建哈希变化"
    note: "代码中匹配 ecom-g-popover + input[type=file] + 文案「本地上传」"

