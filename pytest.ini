[pytest]
# 仓库根**没有** conftest/pytest.ini，测试文件自己把仓库根注入 sys.path。
# 这里只做一件事：把 `tmp_path` 的基准目录固定到工作区内。
#
# 为什么必须固定：本机沙箱下默认的 `%TEMP%\pytest-of-<user>` 会被拒绝列举
# （`PermissionError: [WinError 5]`），于是**所有**用到 `tmp_path` 的测试都
# ERROR，看起来像业务回归失败，其实是环境问题。放到工作区里既真实可写，
# 也让临时文件可回收。
#
# `testpaths` 故意不设——根目录同时有 `tests/`（仓库回归）与
# `taobao-publisher/tests/`（子项目回归），各自的 pytest.ini 决定收集范围。
addopts = --basetemp=taobao-publisher/tmp/pytest-root-basetemp
